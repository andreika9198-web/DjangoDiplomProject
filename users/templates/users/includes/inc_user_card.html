<div class="col-12 col-md-6 col-lg-4 mb-3">
    <div class="card-plant text-center">
        <!-- Аватар -->
        {% if object.avatar %}
            <img src="{{ object.avatar.url }}" alt="Аватар"
                 class="rounded-circle mb-3"
                 style="width: 100px; height: 100px; object-fit: cover;">
        {% else %}
            <div class="rounded-circle bg-secondary d-inline-flex align-items-center justify-content-center mb-3"
                 style="width: 100px; height: 100px;">
                <span style="font-size: 2.5rem;">👤</span>
            </div>
        {% endif %}

        <!-- Имя -->
        <h5>{{ object.first_name }} {{ object.last_name }}</h5>
        <p class="text-muted small mb-2">{{ object.email }}</p>

        <!-- Роль -->
        <span class="status-badge
            {% if object.role == 'admin' %}status-danger
            {% elif object.role == 'moderator' %}status-warn
            {% else %}status-ok{% endif %}">
            {{ object.get_role_display }}
        </span>

        <!-- Кнопка -->
        <div class="mt-3">
            <a href="{% url 'users:user_detail' object.pk %}" class="btn btn-success btn-sm w-100">
                👤 Подробнее
            </a>
        </div>
    </div>
</div>
